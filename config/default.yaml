paths:
  data_root: ./data         # 所有运行时数据的总目录，下面的目录都在 data_root 下
  papers_dir: ./data/papers # 下载或导入的原始论文文件
  parsed_dir: ./data/parsed # PDF 解析后的结构化内容
  index_dir: ./data/index   # 数据库、检索索引和模型缓存的父目录
  sqlite_path: ./data/index/papers.sqlite # SQLite 结构化数据库
  bm25_path: ./data/index/bm25.pkl  # 序列化的 BM25 稀疏检索索引
  models_dir: ./data/index/models   # 本地模型文件和模型缓存

embedding:
  provider: bge-m3
  model_name: BAAI/bge-m3
  dim: 1024
  batch_size: 32
  max_length: 8192
  device: auto

reranker:
  enabled: true
  model_name: BAAI/bge-reranker-v2-m3
  cache_dir: null               # null = use paths.models_dir; else absolute path
  use_fp16: true
  top_k: 8

qdrant:
  url: http://localhost:6333
  collection_chunks: paper_chunks
  collection_wiki: wiki_entries
  distance: Cosine

mineru:
  mode: local
  cli: magic-pdf
  method: ocr
  lang: auto
  timeout_sec: 600
  fallback_to_pymupdf: true

chunk:
  text:
    target_tokens: 500
    overlap_tokens: 50
    encoding: cl100k_base
  context_prefix: "[Title: {title}] [Section: {section}]\n"
  context_prefix_zh: "[标题: {title}] [章节: {section}]\n"

retrieve:
  top_k_dense: 20
  top_k_bm25: 20
  rrf_k: 60
  rerank_top_k: 8
  sparse_backend: fts5          # fts5 | rank_bm25
  fts5_cjk_bigram: true         # 中文按相邻二字对(bigram)入索引; false 退回基准原文行为
  fts5_phrase_max_run: 6        # 中文查询串≤该字数按短语精确匹配, 超过按 bigram OR 词袋召回
  bm25_max_chunks: 200000       # rank_bm25 纯内存后备的规模护栏, 超限拒绝建索引并告警

rag:
  max_inner_iters: 3
  max_inner_tokens: 8000
  enable_hyde: true
  enable_reflect: true
  qa_cache_enabled: false       # set true to cache (question, paper_ids) -> answer for 24h
  qa_cache_ttl_hours: 24
  abstain:                      # ADR-0014 — three-way abstain on weak retrieval evidence
    enabled: true
    # Thresholds calibrated 2026-05-21 via scripts/calibrate_abstain.py (offline mode)
    # against tests/eval/qa_set.real.jsonl (33 q / 3 neg). neg_blocked=100% pos_kept=97%.
    # See data/index/abstain_calibration.json for full audit trail. Re-run online mode
    # once Qdrant index is freshly populated for production-grade calibration.
    threshold_low: 0.21         # < low: no_evidence (LLM call SKIPPED, returns canned message)
    threshold_high: 0.48        # < high but >= low: weak_evidence (LLM called with insufficiency hint)
    min_chunks: 3               # number of top chunks averaged for the evidence score
    no_evidence_message: "未在已索引文献中找到与该问题相关的内容。请确认问题与已入库的论文主题相符，或考虑通过 paper_ingest_tool 扩充语料库。"

llm:
  provider: openai_compatible
  base_url: $OPENAI_BASE_URL
  api_key: $OPENAI_API_KEY
  chat_model: $CHAT_MODEL
  small_model: $SMALL_MODEL
  extra_body: {}              # vendor params passed through to chat.completions.create;
                              # Qwen thinking models need {enable_thinking: false} for non-streaming

vision:
  enabled: false
  provider: openai_compatible
  base_url: $VISION_BASE_URL
  api_key: $VISION_API_KEY
  model: $VISION_MODEL
  timeout_sec: 60
  fallback_local: false
  local_model: Qwen/Qwen2.5-VL-7B-Instruct
  local_max_new_tokens: 256
  max_images_per_paper: 40
  max_image_bytes: 8000000
  cache: true
  cache_dir: ./data/index/vision_cache

wiki:
  enabled: true              # product default; set false only as an ops kill switch
  similarity_threshold: 0.85
  rate_limit_hours: 24
  self_eval_threshold: 0.7

logging:
  level: INFO
  json: false
