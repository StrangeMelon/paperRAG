paths:
  data_root: ./data         # 所有运行时数据的总目录，下面的目录都在 data_root 下
  papers_dir: ./data/papers # 下载或导入的原始论文文件
  parsed_dir: ./data/parsed # PDF 解析后的结构化内容
  index_dir: ./data/index   # 数据库、检索索引和模型缓存的父目录
  sqlite_path: ./data/index/papers.sqlite # SQLite 结构化数据库
  bm25_path: ./data/index/bm25.pkl  # 序列化的 BM25 稀疏检索索引
  models_dir: ./data/index/models   # 本地模型文件和模型缓存

embedding:
  provider: bge-m3
  model_name: BAAI/bge-m3
  version: bge-m3:v1
  dim: 1024
  batch_size: 32
  max_length: 8192
  device: auto

reranker:
  enabled: true
  model_name: BAAI/bge-reranker-v2-m3
  cache_dir: null               # null = use paths.models_dir; else absolute path
  use_fp16: true
  top_k: 8

qdrant:
  url: http://localhost:6333
  collection_chunks: paper_chunks
  collection_wiki: wiki_entries
  distance: Cosine

mineru:
  mode: local
  cli: magic-pdf
  method: ocr
  lang: auto
  timeout_sec: 600
  fallback_to_pymupdf: true

chunk:
  text:
    target_tokens: 500
    overlap_tokens: 50
    encoding: cl100k_base
  context_prefix: "[Title: {title}] [Section: {section}]\n"
  context_prefix_zh: "[标题: {title}] [章节: {section}]\n"

retrieve:
  top_k_dense: 20
  top_k_bm25: 20
  rrf_k: 60
  rerank_top_k: 8
  sparse_backend: fts5          # fts5 | rank_bm25
  fts5_cjk_bigram: true         # 中文按相邻二字对(bigram)入索引; false 退回基准原文行为
  fts5_phrase_max_run: 6        # 中文查询串≤该字数按短语精确匹配, 超过按 bigram OR 词袋召回
  bm25_max_chunks: 200000       # rank_bm25 纯内存后备的规模护栏, 超限拒绝建索引并告警
  references:
    enabled: true
    penalty: 0.15               # 普通查询中参考文献块的有效分乘数
    exclude_from_evidence: true # 普通查询不允许参考文献块进入最终可信证据
    legacy_section_fallback: true

rag:
  max_inner_iters: 3
  max_inner_tokens: 8000
  enable_hyde: true
  enable_reflect: true
  qa_cache_enabled: false       # set true to cache (question, paper_ids) -> answer for 24h
  qa_cache_ttl_hours: 24
  intent:                       # 意图三档检索力度(基准硬编码 _DEFAULTS 的配置化)
    enabled: true               # false: 跳过 LLM 分类调用, 直接走本地信号词启发式
    factual:                    # 查单个事实: 少取、单轮
      top_k: 5
      max_iter: 1
      rrf_k: 60
    reasoning:                   # 对比/多方面分析: 中取、两轮(默认档)
      top_k: 10
      max_iter: 2
      rrf_k: 60
    explore:                     # 综述/全景: 多取、三轮
      top_k: 15
      max_iter: 3
      rrf_k: 60
  abstain:                    # ADR-0014 — three-way abstain on weak retrieval evidence
    enabled: true
    # Thresholds calibrated 2026-05-21 via scripts/calibrate_abstain.py (offline mode)
    # against tests/eval/qa_set.real.jsonl (33 q / 3 neg). neg_blocked=100% pos_kept=97%.
    # See data/index/abstain_calibration.json for full audit trail. Re-run online mode
    # once Qdrant index is freshly populated for production-grade calibration.
    threshold_low: 0.21         # < low: no_evidence (LLM call SKIPPED, returns canned message)
    threshold_high: 0.48        # < high but >= low: weak_evidence (LLM called with insufficiency hint)
    min_chunks: 3               # number of top chunks averaged for the evidence score
    no_evidence_message: "未在已索引文献中找到与该问题相关的内容。请确认问题与已入库的论文主题相符，或考虑通过 paper_ingest_tool 扩充语料库。"
    # 英文问题的拒答文案(qa_agentic 按问题语言路由)
    no_evidence_message_en: "No relevant content was found in the indexed papers. Please check that the question matches the indexed corpus, or ingest more papers via paper_ingest_tool."

evaluation:
  enabled: false
  provider: custom
  backends: [custom]
  metrics: [hit_rate, mrr, recall, paper_hit_rate, citation_precision, citation_recall]
  golden_set: tests/fixtures/evaluation/golden.json
  top_k: 8
  fail_on_error: false
  retrieval_golden_set: tests/fixtures/evaluation/retrieval_golden.json
  max_concurrency: 8           # Custom 纯检索评测同时执行的问题数
  ragas:
    golden_set: tests/fixtures/evaluation/ragas_golden.json
    metrics: [faithfulness, answer_relevancy, context_precision, context_recall]
    base_url: $RAGAS_BASE_URL
    api_key: $RAGAS_API_KEY
    judge_model: $RAGAS_MODEL
    embedding_base_url: $RAGAS_EMBEDDING_BASE_URL
    embedding_api_key: $RAGAS_EMBEDDING_API_KEY
    embedding_model: $RAGAS_EMBEDDING_MODEL
    max_concurrency: 4          # RAGAS QA 问题与指标评分的并发上限
    timeout_sec: 120
    max_retries: 3
    cache_dir: data/evaluation/ragas_cache
    judge_options: {}

llm:
  provider: openai_compatible
  base_url: $OPENAI_BASE_URL
  api_key: $OPENAI_API_KEY
  chat_model: $CHAT_MODEL
  small_model: $SMALL_MODEL
  extra_body: {}              # vendor params passed through to chat.completions.create;
                              # Qwen thinking models need {enable_thinking: false} for non-streaming

vision:
  enabled: true
  provider: openai_compatible
  base_url: $VISION_BASE_URL
  api_key: $VISION_API_KEY
  model: $VISION_MODEL
  timeout_sec: 60
  max_concurrency: 4          # 单篇内 figure/table API 并发数; 主线程仍按 chunk 原序提交
  temperature: 0.01          # ZhipuAI/GLM accepts temperature in (0,1) only; 0 is rejected
  extra_body:                # GLM-4.6V defaults to thinking; reasoning can eat max_tokens
    thinking: {type: disabled}  # leaving content empty/truncated (verified 2026-08-05)
  fallback_local: false
  local_model: Qwen/Qwen2.5-VL-7B-Instruct
  local_max_new_tokens: 256
  max_images_per_paper: 40
  max_image_bytes: 8000000
  cache: true
  cache_dir: ./data/index/vision_cache

wiki:
  enabled: true              # product default; set false only as an ops kill switch
  self_eval_threshold: 0.7
  definition_rewrite_lock_hours: 24  # 只锁定义重写, 论文/证据关系新增不受限
  llm:
    base_url: $WIKI_LLM_BASE_URL     # 专用端点; 必须与 api_key/model 一起设置
    api_key: $WIKI_LLM_API_KEY
    model: $WIKI_LLM_MODEL           # null 时回退全局 llm.chat_model
    thinking: $WIKI_LLM_THINKING     # DeepSeek 官方端点: enabled | disabled
    reasoning_effort: $WIKI_LLM_REASONING_EFFORT  # 原生 low/high/max; 兼容 medium/xhigh
    timeout_sec: 120
    extra_body: {}                   # 阿里云托管可改为 {enable_thinking: false}
  resolve:
    recall_floor: 0.60               # 向量召回下限, 低于此判 novel
    auto_merge_same_lang: 0.90       # 同语言高相似才免 LLM 验证直接合并
    short_label_max_ascii_chars: 4   # RL/CL/GAN/BERT 级缩写不许单独触发合并
    short_label_max_cjk_chars: 1     # 中文单字才算短标签
  extract:
    max_concepts: 5
    char_budget_zh: 4000             # 中文按字符计, 信息密度高于英文
    char_budget_en: 6000
    exclude_sections: [references, bibliography, 参考文献]
  quality_gate:
    min_chunks: 15                   # 低于此块数不建词条(征文通知类文档)
    skip_parsed_with: ["mineru+broken", "pymupdf+broken"]
  consistency:
    min_definition_chars_en: 20
    min_definition_chars_zh: 12
  worker:
    batch_size: 10
    concurrency: 4            # 同时处理的论文数; 受模型端点并发/限流能力约束
    max_attempts: 3
    retry_backoff_sec: [60, 600, 3600]

mcp:
  profile: default
  admission_timeout_sec: 2
  retrieval_timeout_sec: 90
  trace_ttl_sec: 1800
  trace_max_entries: 1000
  max_running_retrievals: 2
  max_queued_retrievals: 8
  thread_tokens: 8
  resources:
    gpu_total: 1
    embedding: 1
    reranker: 1
    vision: 2
    mineru: 1
    llm: 4
    sqlite_write: 1
  timeouts:
    sqlite_sec: 5
    qdrant_sec: 15
    llm_sec: 30
    embedding_sec: 30
    reranker_sec: 30
    external_http_sec: 60

logging:
  level: INFO
  json: false
